# ===== UWSM Check =====
exec-once = ~/.local/share/dotfiles/bin/check-uwsm

# ===== Theme/cursor settings =====
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ===== Wallpaper =====
exec-once = killall hyprpaper 2>/dev/null || true

exec-once = awww-daemon

# ===== vim motions ====
exec-once = kanata --cfg /etc/kanata/kanata.kbd